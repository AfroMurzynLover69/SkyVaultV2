spring.application.name=skyvault-server
spring.main.banner-mode=off

# ---------------------------------------------------------------------------
# HTTP/HTTPS connector
# Values can be overridden with environment variables. SkyVault.ps1 reads
# skyvault.config.json, resolves paths and sets these variables before launch.
# ---------------------------------------------------------------------------
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:${PORT:8443}}
server.ssl.enabled=${SERVER_SSL_ENABLED:true}
server.ssl.key-store=${SERVER_SSL_KEY_STORE:classpath:skyvault-dev.p12}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:${SSL_KEYSTORE_PASSWORD:skyvault}}
server.ssl.key-store-type=${SERVER_SSL_KEY_STORE_TYPE:PKCS12}
server.ssl.key-alias=${SERVER_SSL_KEY_ALIAS:skyvault}
server.shutdown=${SERVER_SHUTDOWN:graceful}
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:30s}

# ---------------------------------------------------------------------------
# Tomcat: threads, connections and limits
# ---------------------------------------------------------------------------
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:512}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN_SPARE:16}
server.tomcat.max-connections=${SERVER_TOMCAT_MAX_CONNECTIONS:8192}
server.tomcat.accept-count=${SERVER_TOMCAT_ACCEPT_COUNT:512}
server.tomcat.connection-timeout=${SERVER_TOMCAT_CONNECTION_TIMEOUT_MS:20000}
server.tomcat.keep-alive-timeout=${SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT_MS:20000}
server.tomcat.max-http-request-header-size=${SERVER_TOMCAT_MAX_HTTP_REQUEST_HEADER_SIZE:16KB}
server.tomcat.max-http-form-post-size=${SERVER_TOMCAT_MAX_HTTP_FORM_POST_SIZE:2MB}

# ---------------------------------------------------------------------------
# HTTP compression
# ---------------------------------------------------------------------------
server.compression.enabled=${SERVER_COMPRESSION_ENABLED:true}
server.compression.min-response-size=${SERVER_COMPRESSION_MIN_RESPONSE_SIZE:2KB}
server.compression.mime-types=${SERVER_COMPRESSION_MIME_TYPES:application/json,application/javascript,text/html,text/css,text/plain,image/svg+xml}

# ---------------------------------------------------------------------------
# SkyVault application limits
# ---------------------------------------------------------------------------
skyvault.server.max-concurrent-users=${SKYVAULT_SERVER_MAX_CONCURRENT_USERS:${MAX_CONCURRENT_USERS:256}}
skyvault.server.acquire-timeout-ms=${SKYVAULT_SERVER_ACQUIRE_TIMEOUT_MS:${ACQUIRE_TIMEOUT_MS:2000}}
skyvault.server.name=SkyVault
skyvault.server.version=0.1.0

# ---------------------------------------------------------------------------
# PostgreSQL and Hikari pool
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:skyvault}
spring.datasource.username=${DB_USER:skyvault}
spring.datasource.password=${DB_PASSWORD:skyvault}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# Encrypted blobs, plan state and quotas
# ---------------------------------------------------------------------------
skyvault.storage.directory=${SKYVAULT_STORAGE_DIRECTORY:${SKYVAULT_DATA_DIR:data/files}}
skyvault.storage.default-quota-gb=${SKYVAULT_STORAGE_DEFAULT_QUOTA_GB:${DEFAULT_QUOTA_GB:5}}
skyvault.storage.plan-state-file=${SKYVAULT_STORAGE_PLAN_STATE_FILE:${SKYVAULT_PLAN_FILE:data/plans.json}}
skyvault.storage.plan-state-refresh-ms=${SKYVAULT_STORAGE_PLAN_STATE_REFRESH_MS:${PLAN_STATE_REFRESH_MS:30000}}

spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:110MB}

# ---------------------------------------------------------------------------
# Server-side backups
# The server itself creates the archives, so no Windows task is involved.
# Cron uses the Spring format: second minute hour day month weekday.
# ---------------------------------------------------------------------------
skyvault.backup.enabled=${SKYVAULT_BACKUP_ENABLED:true}
skyvault.backup.directory=${SKYVAULT_BACKUP_DIRECTORY:backups}
skyvault.backup.cron=${SKYVAULT_BACKUP_CRON:0 0 0 * * *}
skyvault.backup.keep-copies=${SKYVAULT_BACKUP_KEEP_COPIES:2}
skyvault.backup.compression-level=${SKYVAULT_BACKUP_COMPRESSION_LEVEL:9}
skyvault.backup.dictionary-mb=${SKYVAULT_BACKUP_DICTIONARY_MB:64}
skyvault.backup.include-database=${SKYVAULT_BACKUP_INCLUDE_DATABASE:true}
skyvault.backup.include-files=${SKYVAULT_BACKUP_INCLUDE_FILES:true}
skyvault.backup.include-plan-state=${SKYVAULT_BACKUP_INCLUDE_PLAN_STATE:true}
skyvault.backup.verify-after-create=${SKYVAULT_BACKUP_VERIFY_AFTER_CREATE:true}
skyvault.backup.catch-up=${SKYVAULT_BACKUP_CATCH_UP:true}
skyvault.backup.pg-dump-path=${SKYVAULT_BACKUP_PG_DUMP_PATH:}

# ---------------------------------------------------------------------------
# Browser sessions
# ---------------------------------------------------------------------------
skyvault.session.cookie-name=${SKYVAULT_SESSION_COOKIE_NAME:${SESSION_COOKIE_NAME:skyvault_session}}
skyvault.session.lifetime-days=${SKYVAULT_SESSION_LIFETIME_DAYS:${SESSION_LIFETIME_DAYS:7}}
skyvault.session.same-site=${SKYVAULT_SESSION_SAME_SITE:${SESSION_COOKIE_SAME_SITE:Lax}}
skyvault.session.secure=${SKYVAULT_SESSION_SECURE:${SESSION_COOKIE_SECURE:true}}
skyvault.session.http-only=${SKYVAULT_SESSION_HTTP_ONLY:${SESSION_COOKIE_HTTP_ONLY:true}}

# ---------------------------------------------------------------------------
# Actuator and static resources
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info,metrics}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:always}

spring.web.resources.cache.cachecontrol.no-store=true

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
# One short line per event on the console. The framework's own startup noise
# (Spring, Hibernate, Tomcat, Hikari, Flyway) is hidden; the startup summary
# comes from com.skyvault.StartupLog after the application is ready.
logging.pattern.console=${LOGGING_PATTERN_CONSOLE:%d{HH:mm:ss.SSS}  %-5level  %logger{0} - %msg%n}

logging.level.root=${LOGGING_LEVEL_ROOT:${LOG_LEVEL:INFO}}
logging.level.com.skyvault=INFO
# Spring Boot logs "Starting/Started ServerApplication" through the main class
# logger; the startup summary below already covers that, so keep it quiet.
logging.level.com.skyvault.ServerApplication=WARN
logging.level.com.skyvault.plan.PlanStateFile=WARN
logging.level.org.springframework.web.servlet=ERROR
logging.level.Activity=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.apache=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.flywaydb=WARN
logging.file.name=${LOGGING_FILE_NAME:${LOG_FILE:logs/skyvault.log}}
logging.logback.rollingpolicy.max-file-size=${LOGGING_LOGBACK_ROLLINGPOLICY_MAX_FILE_SIZE:${LOG_MAX_FILE_SIZE:10MB}}
logging.logback.rollingpolicy.max-history=${LOGGING_LOGBACK_ROLLINGPOLICY_MAX_HISTORY:${LOG_MAX_HISTORY:7}}
logging.logback.rollingpolicy.total-size-cap=${LOGGING_LOGBACK_ROLLINGPOLICY_TOTAL_SIZE_CAP:${LOG_TOTAL_SIZE_CAP:100MB}}
