spring.application.name=skyvault-server

# --- HTTP ---
server.port=${PORT:8080}

# --- Pula watkow Tomcata ---
# 256 watkow = tyle jednoczesnych zadan obsluzy kontener.
# accept-count: ile zadan moze czekac w kolejce systemowej, gdy pula jest zajeta.
server.tomcat.threads.max=256
server.tomcat.threads.min-spare=16
server.tomcat.accept-count=512
server.tomcat.max-connections=8192

# --- Limit wspolbieznosci aplikacji ---
# max-concurrent-users: ilu uzytkownikow obslugujemy jednoczesnie (wymagane 256)
# acquire-timeout-ms:   ile czekac na wolne miejsce, zanim zwrocimy HTTP 429
skyvault.server.max-concurrent-users=${MAX_CONCURRENT_USERS:256}
skyvault.server.acquire-timeout-ms=${ACQUIRE_TIMEOUT_MS:2000}
skyvault.server.name=SkyVault
skyvault.server.version=0.1.0

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:skyvault}
spring.datasource.username=${DB_USER:skyvault}
spring.datasource.password=${DB_PASSWORD:skyvault}

# --- JPA / Hibernate ---
# "validate" = Hibernate nie tworzy tabel sam, schemat robi wylacznie Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
# Migracje leza w: Server/src/main/resources/db/migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Przechowywanie zaszyfrowanych blobow ---
# Serwer zapisuje bajty dokladnie tak, jak dostal je od klienta.
skyvault.storage.directory=${SKYVAULT_DATA_DIR:data/files}
skyvault.storage.default-quota-gb=${DEFAULT_QUOTA_GB:5}

# --- Upload ---
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# --- Actuator (monitoring) ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# --- Zasoby statyczne ---
# Spring Boot pakuje wpisy JAR z data 1980-02-01 (powtarzalne buildy), wiec
# przegladarka dostawalaby 304 i trzymala stare GUI po aktualizacji.
# no-store wymusza pobranie aktualnych plikow przy kazdym wejsciu.
spring.web.resources.cache.cachecontrol.no-store=true

# --- Logi ---
logging.level.root=INFO
